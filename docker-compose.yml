services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - /root/web/zvuchi-vocal/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zvuchi -d zvuchi_vocal"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/possesion/zvuchi-vocal:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - /root/web/zvuchi-vocal/.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

